      existing-customer login only — page title "OpticOdds Login: Access My
      Dashboard"
supersedes: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted a
  Free/Professional/Enterprise ladder with a 1,000 req/month free quota and a
  100,000 req/month pro quota. None of those tiers or numbers were ever
  published by OpticOdds. They were scaffold defaults and are removed here.
