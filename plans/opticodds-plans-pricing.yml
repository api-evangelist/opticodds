description: >-
  OpticOdds publishes NO plans, tiers, prices or quotas. The page at
  opticodds.com/pricing is titled "Get the Scoop on OpticOdds Pricing" and is a
  three-step lead-capture form (company size, which services you need, contact
  details) ending in "Our team will review your details and get back to you
  shortly". There is no price, no currency, no billing period, no included
  quota and no overage rate anywhere on the site or in the developer
  documentation. Every engagement is sales-negotiated.
plan_count: 0
plans: []
pricing_model:
  published: false
  model: contact-sales
  self_serve_checkout: false
  free_trial:
    offered: true
    self_serve: false
    source: https://developer.opticodds.com/docs/api-faq.md
    note: >-
      The API FAQ addresses readers "just starting your free trial", so a trial
      exists, but it is arranged through a sales rep — there is no self-serve
      signup path. opticodds.com/login and opticodds.com/sign-up both return
      404; the only account surface is the existing-customer dashboard at
      app.opticodds.com.
  add_ons:
    - name: OpenOdds Partnership Program
      url: https://developer.opticodds.com/docs/third-party-partners.md
      note: >-
        Third-party data providers are sold as "an optional add-on to your
        existing plan". No price published.
evidence:
