description: >-
  Binds each published OpticOdds MCP tool to the REST operation(s) that back
  it, and records what each surface holds that the other does not. The
  harvested OpenAPI declares NO operationId on any operation (it is a swaggo
  document generated from Go handlers), so REST operations are identified here
  by METHOD + PATH, which is the only stable identifier the contract provides.
  Bindings are by name and documented semantics: the live MCP tools/list is
  auth-gated (HTTP 401), so no tool inputSchema was readable and no binding is
  asserted at high confidence beyond a one-to-one name/path match.
