aid: opticodds
name: OpticOdds
description: >-
  OpticOdds is a B2B sports betting data provider whose v3 REST API delivers
  real-time and historical odds aggregated from 200+ sportsbooks, covering main
  lines, player props, alternate markets, futures, injuries and injury
  predictions, fixtures, results, and same-game-parlay pricing. The platform
  serves sportsbook operators and traders, prediction markets, platform
  providers, DFS operators, betting apps, and media and affiliate businesses.
  Alongside the polling API it publishes Server-Sent Events streaming endpoints
  and RabbitMQ push queues, a bet-settlement grader, and a first-party Model
  Context Protocol server available both as a hosted endpoint and as an npm
  package. OpticOdds is part of Gambling.com Group.
