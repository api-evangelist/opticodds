x-pointer-notes:
  no_pricing_pointer: >-
    opticodds.com/pricing returns HTTP 200 but is a three-step lead-capture
    form with no price, tier, quota or currency on it. The pricing_link check
    reads public pricing, and "contact us" is not that, so no Pricing pointer
    is emitted. See plans/opticodds-plans-pricing.yml.
  no_signup_pointer: >-
    opticodds.com/sign-up and opticodds.com/login both return 404.
    app.opticodds.com is an existing-customer dashboard login, not a
    self-service registration path, so no SignUp or Login pointer is emitted.
  no_wellknown_pointer: >-
    Every /.well-known/ path probed 404 on all three hosts. The probe record is
    wired as WellKnownProbe so the measurement is not lost, deliberately NOT as
    WellKnown, which would assert a served surface.
  no_webhooks_pointer: >-
    OpticOdds states in its API FAQ that it offers neither webhooks nor
    WebSockets. The event surface is SSE and RabbitMQ, captured in
    conventions/opticodds-conventions.yml.
  no_deprecation_pointer: >-
    Removals are announced in the changelog and the v2-to-v3 migration guide,
    but no deprecation policy, notice period, or Sunset/Deprecation header is
    published.
  no_security_or_compliance_pointer: >-
    No security.txt, no vulnerability-disclosure page, no bug bounty, and no
    trust center or published certification were found. trust.opticodds.com
    does not resolve; opticodds.com/security returns 404.
  no_sdks_pointer: >-
    OpticOdds publishes no first-party REST client library in any registry. The
    one first-party npm package, opticodds-mcp, is an MCP server rather than an
    SDK, and the only REST client on npm is a community package under the
    third-party @sports-sdk scope.
