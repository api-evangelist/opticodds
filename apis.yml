  note: >-
    Corrected 2026-08-27. The prior freemium/self-serve label was derived from a
    2026-05-04 scaffold. OpticOdds publishes no plans or prices;
    opticodds.com/pricing is a lead-capture form, opticodds.com/sign-up and
    /login both return 404, and the only account surface is the
    existing-customer dashboard at app.opticodds.com. A free trial exists but
