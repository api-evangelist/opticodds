    player props, injuries, results, line history, best-price and outlier detection, line comparison and
    bet grading. Shipped in both deployment shapes: a hosted remote endpoint at https://api.opticodds.com/mcp
    and a local stdio server published to npm as opticodds-mcp. Marketed as Sportsbook AI.
