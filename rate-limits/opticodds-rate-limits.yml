specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: OpticOdds
providerId: opticodds
generated: '2026-08-27'
method: searched
source: https://developer.opticodds.com/docs/api-faq.md
created: '2026-05-04'
modified: '2026-08-27'
tags:
  - Odds
  - Sports Betting
  - Sports Data
  - Rate Limiting
  - Throttling
description: >-
  OpticOdds publishes three rate limits, all on a fixed 15-second window, in
  the API FAQ under "What is the request limit around the API?". The limits are
  endpoint-class-scoped rather than plan-scoped: the docs state one set of
  numbers with no tier variation. OpticOdds does NOT document any rate-limit
  response headers or the status code returned on exhaustion, which is the
  material gap for an agent: a client can read the ceiling from the docs but
  cannot read its remaining budget at runtime.
limit_count: 3
window:
  length: 15
  unit: second
  reset: >-
    Fixed window. The provider states "the limit resets after the 15s are
    completed" and "These will all reset after 15 seconds."
limits:
  - name: Historical odds endpoints
    scope: per-key
    applies_to:
      - GET /fixtures/odds/historical
      - GET /copilot/fixtures/odds/historical
    limit: 10
    window: 15s
    metric: requests
    burst: null
    source: https://developer.opticodds.com/docs/api-faq.md
  - name: Streaming endpoints (new connections)
    scope: per-key
    applies_to:
      - GET /stream/odds/{sport}
      - GET /stream/results/{sport}
      - GET /stream/futures/{sport}
      - GET /stream/copilot/{sport}/odds
      - GET /stream/prediction-markets
    limit: 250
    window: 15s
    metric: new connections
    burst: null
    source: https://developer.opticodds.com/docs/api-faq.md
    note: >-
      Counts connection establishment, not events received. Long-lived SSE
      connections do not consume the polling budget.
  - name: All other endpoints
    scope: per-key
    applies_to:
      - all remaining REST operations
    limit: 2500
    window: 15s
    metric: requests
    burst: null
    source: https://developer.opticodds.com/docs/api-faq.md
headers:
  documented: false
  limit: null
  remaining: null
  reset: null
  retry_after: null
  policy: null
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented anywhere
    in the OpticOdds documentation, and none appears in the harvested OpenAPI —
    no operation declares a 429 response. Not asserted here, because we have
    not observed a throttled response: authentication is required before any
    call, so the runtime signal could not be probed anonymously.
response_codes:
  throttled: null
  note: >-
    The contract declares 400, 401, 403, 404 and 500 across its operations. No
    429 is declared on any of the 51 operations, so the status code returned on
    exhaustion is undocumented.
concurrency_limits:
  - name: Sportsbooks per request
    limit: 5
    scope: per-request
    source: https://developer.opticodds.com/docs/api-faq.md
    note: >-
      "Each request can retrieve data from up to 5 sports books
      simultaneously." Enforced as a request-shape constraint, not a rate.
  - name: Recommended leagues per stream connection
    limit: 10
    scope: per-connection
    binding: recommendation
    source: https://developer.opticodds.com/docs/sse-streaming.md
    note: >-
      "OpticOdds recommends grouping up to 10 leagues per connection." A
      published best practice, not an enforced ceiling.
plan_variation:
  documented: false
  note: >-
    The published limits carry no tier qualifier and OpticOdds publishes no
    plans at all (see plans/opticodds-plans-pricing.yml), so no per-tier rate
    ladder can be recorded.
supersedes: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted
  free/professional/enterprise tiers at 10/100/1000 requests per minute with
  monthly quotas and a full X-RateLimit-* header set. None of those numbers or
  headers were ever published by OpticOdds; they were scaffold defaults and are
  removed here in favour of the three limits the provider actually documents.
maintainers:
